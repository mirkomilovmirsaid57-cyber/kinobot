services:
  - type: worker
    name: kinobot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        value: 8717154652:AAHljagqYLi8wdi5nMCypwN-_RetW5DL0m8
      - key: DATABASE_URL
        fromDatabase:
          name: kinobot-db
          property: connectionString
      - key: ADMIN_IDS
        value: "7265693059"

databases:
  - name: kinobot-db
    databaseName: kinobot
    user: kinobot_user
    plan: free
